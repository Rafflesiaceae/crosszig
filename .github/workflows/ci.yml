name: Pixi build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            os: ubuntu-latest

          - platform: linux-aarch64
            os: ubuntu-24.04-arm

          - platform: win-64
            os: windows-latest

          - platform: osx-64
            os: macos-15-intel

          - platform: osx-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0

      - name: Build
        run: pixi run dev build --all --release --accept-msvc-license

      - name: Dist
        run: pixi run dev dist

      # CMake only prints the outcome of its compiler checks; the actual
      # compiler and linker output of every try_compile lands in these logs.
      # Keep them around when the build breaks so failures that only happen on
      # one runner can be diagnosed without reproducing them locally.
      - name: Upload CMake logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-${{ matrix.platform }}
          path: |
            build/*/CMakeFiles/CMakeConfigureLog.yaml
            build/*/CMakeCache.txt
          if-no-files-found: ignore
