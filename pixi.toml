[workspace]
authors = ["User <user.user@gmail.com>"]
channels = ["conda-forge"]
name = "omni-bot"
platforms = ["linux-64", "linux-aarch64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
dev = { cmd = ["python", "./dev.py"] }

[dependencies]
cmake = "4.4.3.*"
ninja = "1.13.2.*"
python = "3.14.7.*"
zig = "0.17.*"

# xwin publishes binaries for Linux and Windows only, so tools/xwin.py compiles
# it from source on macOS. Rust is pulled in for those two hosts and nowhere
# else, since the others download the release and never invoke cargo. 1.85 is
# the floor for the 2024 edition xwin is written in.
[target.osx-64.dependencies]
rust = ">=1.85"

[target.osx-arm64.dependencies]
rust = ">=1.85"
